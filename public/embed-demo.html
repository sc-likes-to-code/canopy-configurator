<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canopy Studio | Shopify Store Embedding Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      max-width: 1280px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background-color: #1e3a8a;
      color: #93c5fd;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .embed-code-card {
      width: 100%;
      max-width: 1280px;
      margin-bottom: 20px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .embed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .embed-title {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .copy-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .copy-btn:hover {
      background: #1d4ed8;
    }
    pre {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .container {
      width: 100%;
      max-width: 1280px;
      height: 750px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h2 style="font-size: 18px; font-weight: 700; color: #ffffff;">Storefront Integration Mockup</h2>
      <span class="badge">IFrame Embed Container</span>
    </div>
    <p style="font-size: 13px; color: #94a3b8;">Simulated E-Commerce Product Customizer Embed</p>
  </header>

  <!-- Embed Snippet Card -->
  <div class="embed-code-card">
    <div class="embed-header">
      <span class="embed-title">HTML IFrame Embed Code (Auto-Detected Origin)</span>
      <button id="copy-btn" class="copy-btn">Copy Embed Code</button>
    </div>
    <pre id="embed-snippet"></pre>
  </div>

  <!-- Configurator IFrame Viewport -->
  <div class="container">
    <iframe id="configurator-iframe" title="Canopy Studio Configurator"></iframe>
  </div>

  <footer>
    Canopy Studio 3D Configurator Engine &bull; Ready for Shopify / Webflow / Custom Platform Embedding
  </footer>

  <script>
    // Dynamically derive configurator URL from window.location.origin
    const origin = window.location.origin;
    const configuratorUrl = origin + '/';

    // 1. Set iframe source dynamically
    const iframe = document.getElementById('configurator-iframe');
    if (iframe) {
      iframe.src = configuratorUrl;
    }

    // 2. Generate dynamic embed snippet
    const embedSnippetText = `<iframe\n  src="${configuratorUrl}"\n  width="100%"\n  height="800"\n  style="border:0;"\n  title="Canopy Studio Configurator"\n></iframe>`;

    const snippetElem = document.getElementById('embed-snippet');
    if (snippetElem) {
      snippetElem.textContent = embedSnippetText;
    }

    // 3. Handle Copy Embed Code button action
    const copyBtn = document.getElementById('copy-btn');
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(embedSnippetText).then(() => {
          const originalText = copyBtn.textContent;
          copyBtn.textContent = 'Copied!';
          copyBtn.style.backgroundColor = '#059669';
          setTimeout(() => {
            copyBtn.textContent = originalText;
            copyBtn.style.backgroundColor = '#2563eb';
          }, 2000);
        });
      });
    }
  </script>
</body>
</html>
